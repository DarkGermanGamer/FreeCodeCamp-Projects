<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="plants">
            <label for="plants">Watered the plants?</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Guide about watering plants.</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="reservation">
            <label for="reservation">Confirmed the hotel reservation?</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Hotel "Haus am See".</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="snacks">
            <label for="snacks">Packed snacks for the trip?</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Top 10 snacks for long trips.</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="locked">
            <label for="locked">Locked the door?</label>
            
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">How to keep a home safe.</a>
                </li>
            </ul>
        </li>
    </ul>
</body>

</html>
