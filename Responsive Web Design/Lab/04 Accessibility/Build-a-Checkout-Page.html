<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img 
            src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" 
            alt="An unsolved rubik's cube. The top and bottom rows are partially turned."
        >
    </section>

    <section>
        <h2>Payment Information </h2>
        
        <form>
            <label for="card-name">
                Card Name
                <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-name" name="card-name" required>
            <br />

            <label for="card-number">
                Card Number
                <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>
            <p id="card-number-help">
                Card number must follow the format XXXX XXXX XXXX XXXX
            </p>
        </form>
    </section>
</body>

</html>
